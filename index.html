<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Solo Spot Mapは、一人で入りやすいカフェ、喫煙所、漫画喫茶、深夜スポットを条件別に探せるソロ利用向けマップです。"
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Solo Spot Map",
        "url": "https://solospot.jp/",
        "description": "一人で入りやすい場所を、喫煙可・電源・深夜営業などの条件で探せるマップ。",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://solospot.jp/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <title>Solo Spot Map | 一人利用スポット検索</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
